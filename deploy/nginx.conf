# shaostassen.com — nginx
#
# Implements the same ruleset as scripts/serve-static.mjs, which the
# Playwright suite (tests/hosting.spec.ts) runs against. If you change one,
# change both.
#
# Unlike Caddy, nginx does not obtain certificates itself — pair this with
# certbot (`certbot --nginx -d shaostassen.com -d www.shaostassen.com`),
# which installs a renewal timer.
#
# Validate: sudo nginx -t
# Reload:   sudo systemctl reload nginx

# www -> apex, matching the 308 Vercel serves today.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.shaostassen.com;

    ssl_certificate     /etc/letsencrypt/live/shaostassen.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shaostassen.com/privkey.pem;

    return 308 https://shaostassen.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name shaostassen.com www.shaostassen.com;
    return 308 https://shaostassen.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name shaostassen.com;

    root /srv/shaostassen.com;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/shaostassen.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shaostassen.com/privkey.pem;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json text/javascript
               application/javascript image/svg+xml;
    gzip_min_length 1024;

    # add_header does not inherit into a location that declares its own, so
    # these are repeated in every location below that sets headers. That is
    # nginx's actual inheritance rule, not redundancy.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self'; connect-src 'self'; form-action 'none'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Content-hashed by the build — safe to cache forever.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Next writes the seven generated OG cards with no file extension, so
    # nginx types them application/octet-stream by default — the bug
    # production has today. Name the type explicitly.
    location = /opengraph-image {
        types { }
        default_type image/png;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location ~ ^/projects/[^/]+/opengraph-image$ {
        types { }
        default_type image/png;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Stable filenames whose bytes could change on a redeploy.
    location ~* \.(png|jpe?g|webp|avif|svg|ico|mp4|webm)$ {
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Clean URLs: the site links to /about, the export holds about.html.
    # Documents must revalidate or a deploy never reaches a warm cache.
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self'; connect-src 'self'; form-action 'none'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri $uri.html $uri/index.html =404;
    }

    # 404.html must come back with a 404 status, not 200.
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-store" always;
    }
}
